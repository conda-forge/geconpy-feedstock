context:
  name: gEconpy
  version: "2.4.0"
  python_min: "3.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/geconpy-${{ version }}.tar.gz
  sha256: c1d0b0287e73ec76e420de832c359a0be80fd41ce685193473fb8a9513aa3db8

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - better-optimize >=0.4.2
    - matplotlib-base
    - networkx
    - numba
    - numpy
    - pandas
    - pymc >=6.3.0
    - pymc-extras >=0.15.1
    - preliz >=0.27.0
    - pyparsing
    - pytensor >=3.3.0
    - scipy
    - setuptools
    - sympy >=1.14.0
    - sympytensor >=2.1.0
    - ipython
    - xarray

tests:
  - python:
      imports:
        - gEconpy
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/jessegrabowski/gEconpy
  summary: A package for solving, estimating, and analyzing DSGE models
  license: GPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jessegrabowski
