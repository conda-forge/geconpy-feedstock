context:
  name: gEconpy
  version: "2.3.0"
  python_min: "3.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/geconpy-${{ version }}.tar.gz
  sha256: 2b2d161e37e094f688a0d464c122b19cc4d84ab3839b9f8626375695acab2e9b

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - better-optimize >=0.2.1
    - matplotlib-base
    - networkx
    - numba
    - numpy
    - pandas
    - pymc >=6.0.0
    - pymc-extras >=0.11.0
    - preliz >=0.23.0
    - pyparsing
    - pytensor >=3.0.0
    - scipy
    - sympy >=1.14.0
    - sympytensor >=2.0.0
    - ipython
    - xarray

tests:
  - python:
      imports:
        - gEconpy
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/jessegrabowski/gEconpy
  summary: A package for solving, estimating, and analyzing DSGE models
  license: GPL-3.0-only
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jessegrabowski
